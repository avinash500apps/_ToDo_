        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 350px;  /* Set the exact width */
            height: 500px; /* Set the exact height */
            background: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 16px;
            background: white;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #4a5568;
        }

        input, select {
            width: 100%;
            margin-top: 4px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease-in-out;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .mb-4 {
            margin-bottom: 16px;
        }

        .flex {
            display: flex;
            justify-content: space-between;
        }

        button {
            width: 48%;
            color: white;
            padding: 8px 0;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        button:first-child {
            background: #a0aec0;
        }

        button:first-child:hover {
            background: #718096;
        }

        button:last-child {
            background: #2563eb;
        }

        button:last-child:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="task-title">Create New Task</h2>
    
        <input type="text" id="record_id" value="0" hidden />
        <div class="mb-4">
            <label>Select Date</label>
            <input type="date" id="datee">
        </div>
    
        <div class="grid">
            <div>
                <label>Start Time</label>
                <input type="time" id="start_time">
            </div>
            <div>
                <label>End Time</label>
                <input type="time" id="end_time">
            </div>
        </div>
    
        <div class="mb-4">
            <label>Category</label>
            <select id="category"></select>
        </div>

        <div class="mb-4">
            <label>Task Name</label>
            <input type="text" id="task_name" placeholder="Enter task name">
        </div>
    
        <div class="mb-4">
            <label>Notes</label>
            <input type="text" id="notes" placeholder="Enter Notes">
        </div>
    
        <div class="flex">
            <button id="resetBtn" onclick="resetData()">Reset</button>
