<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex h-screen bg-gray-100">
    <div class="flex flex-row w-full">
        <div class="w-96 bg-blue-900 text-white flex flex-col p-5 space-y-4">
            <h2 class="text-xl mt-5 font-bold">Private</h2>
            <nav class="flex flex-col space-y-2">
                <ul id="list-container" class="space-y-2"></ul>

                <!-- Input field to add a new list -->
                <div class="flex items-center">
                    <input id="new-list-input" type="text" placeholder="  +  Create new list"
                        class="rounded-lg h-10 py-2 px-4 flex-1 text-black">
                    <button id="add-list-btn" class="ml-2 bg-blue-600 text-white px-3 py-2 rounded-lg hover:bg-blue-800"
                        onclick="addItem()">
                        ➕
                    </button>
                </div>
            </nav>
            <div class="mb-10">
                <h2 class="text-xl font-bold mt-5">Group</h2>
                <nav class="flex flex-col space-y-2 mt-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="text-center">
                            <a href="#" class="py-4 px-4 rounded-sm">
                                <img src="https://t4.ftcdn.net/jpg/04/85/39/87/360_F_485398728_aKL9duq8W78nnZ65BR3oGRMgari0sWEG.jpg"
                                    class="w-24 h-24 object-cover mx-auto rounded  hover:bg-white-600 ">
                            </a>
                            <p class="mt-0 text-sm">AgileCRM</p>
                        </div>
                        <div class="text-center">
                            <a href="#" class="py-4 px-4 rounded-lg">
                                <img src="https://static.vecteezy.com/system/resources/previews/035/974/483/non_2x/ai-generated-multi-ethnic-diverse-group-of-people-free-photo.jpg"
                                    alt="image2" class="w-24 h-24 object-cover mx-auto rounded">
                            </a>
                            <p class="mt-0 text-sm">AllRounder.io</p>
                        </div>
                    </div>
                    <input type="text" placeholder="  +  Create new group" class="rounded-lg h-10 py-4 px-4">
                </nav>
            </div>
        </div>
        <div class="flex-1">
            {% include "body.html" %}
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000"

        async function addItem() {
            const inputField = document.getElementById("new-list-input")
            const name = inputField.value.trim()

            if (!name) {
                alert("Please enter a list name!")
                return;
            }

            const payload = { name };

            try {
                const response = await fetch(`${API_URL}/create-document/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (response.ok) {
                    inputField.value = "";
                    loadLists()
                } else {
                    alert("Error creating list");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while creating the list");
            }
        }


        async function loadLists() {
            try {
                const response = await fetch(`${API_URL}/tasks`)
                const data = await response.json()
                const lists = data.data || []

                const listContainer = document.getElementById("list-container")
                listContainer.innerHTML = ""

                lists.forEach((list) => {
                    const li = document.createElement("a")
                    li.href = "#"
                    li.className = "py-4 px-4 rounded-lg hover:bg-blue-600 flex justify-between items-center bg-blue-800"

                    // List name with icon on the left side
                    const span = document.createElement("span")
                    span.className = "flex items-center"
                    span.innerHTML = `${list.name}`

                    // Delete button (right side)
                    const deleteButton = document.createElement("button")
                    deleteButton.className = "text-red-300 hover:text-red-500 ml-4"
                    deleteButton.innerHTML = "📋"
                    deleteButton.onclick = (event) => {
                        event.stopPropagation()
                        deleteList(list._id)
                    }

                    // Edit button (right side)
                    const editButton = document.createElement("button")
                    editButton.className = "text-yellow-300 hover:text-yellow-500 ml-4"
                    editButton.innerHTML = "✏️"
                    editButton.onclick = (event) => {
                        event.stopPropagation()
                        editList(list._id, list.name)
                    }

                    // Adding all elements
                    const actionsContainer = document.createElement("div")
                    actionsContainer.className = "ml-auto flex items-center"
                    actionsContainer.appendChild(deleteButton)
                    actionsContainer.appendChild(editButton)

                    li.appendChild(span)
                    li.appendChild(actionsContainer)
                    listContainer.appendChild(li)
                })
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }


        async function deleteList(id) {
            if (!confirm("Are you sure you want to delete this list?")) return

            try {
                const response = await fetch(`${API_URL}/delete-document/tasks/${id}`, {
                    method: "DELETE",
                });

                if (response.ok) {
                    loadLists()
                } else {
                    alert("Error deleting list")
                }
            } catch (error) {
                console.error("Error:", error)
            }
        }

        async function editList(id, currentName) {
            const newName = prompt("Edit list name:", currentName);
            if (newName === null || newName.trim() === "") return;

            const payload = { name: newName.trim() };

            try {
                const response = await fetch(`${API_URL}/update-document/tasks/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (response.ok) {
                    loadLists()
                } else {
                    alert("Error updating list");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred while updating the list");
            }
        }

        document.addEventListener("DOMContentLoaded", loadLists)
    </script>
</body>

</html>
