<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-11/12 max-w-4xl bg-black border border-black rounded-xl shadow-lg overflow-hidden p-6">
        <div class="flex flex-col md:flex-row gap-10">
            <!-- Left Section (Login Form) -->
            <div class="flex-1 flex flex-col text-white items-center p-8">
                <h1 class="text-4xl font-bold mb-6">Login to ToDo</h1>
                
                <form class="w-full max-w-sm" id="loginForm">
                    <input type="email" id="email" placeholder="Email" required
                        class="w-full h-12 p-2 border border-gray-300 rounded-md bg-transparent text-white mb-4">
                    
                    <input type="password" id="password" placeholder="Password" required
                        class="w-full h-12 p-2 border border-gray-300 rounded-md bg-transparent text-white mb-4">
                    
                    <div class="flex items-center space-x-2 mb-4">
                        <input type="checkbox" id="terms" required>
                        <label for="terms" class="text-sm">
                            I agree to the <a href="#" class="text-blue-400 hover:underline">Terms & Conditions</a>
                        </label>
                    </div>
                    
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-md cursor-pointer">
                        Login
                    </button>
                </form>
                
                <p class="mt-4">Not registered yet? <a href="/" class="text-blue-400 hover:underline">Register</a></p>
                <p id="errorMessage" class="text-red-400 mt-4"></p>
            </div>

            <!-- Right Section (Image) -->
            <div class="flex-1 hidden md:block">
                <img src="https://cdni.iconscout.com/illustration/premium/thumb/todo-list-illustration-download-in-svg-png-gif-file-formats--checklist-task-food-drink-illustrations-2371075.png?f=webp" 
                    alt="Login Image" class="w-full h-auto rounded-md">
            </div>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const termsChecked = document.getElementById("terms").checked;
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.textContent = ""; // Clear previous errors

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorMessage.textContent = "Please enter a valid email address.";
                return;
            }

            // Password validation
            if (password.length < 6) {
                errorMessage.textContent = "Password must be at least 6 characters long.";
                return;
            }

            // Terms checkbox validation
            if (!termsChecked) {
                errorMessage.textContent = "You must agree to the Terms & Conditions.";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("token", data.token);
                    alert("Login successful!");
                    window.location.href = "/sidebar"
                } else {
                    errorMessage.textContent = data.detail || "Invalid credentials. Please try again.";
                }
            } catch (error) {
                errorMessage.textContent = "Server error. Please try again later.";
            }
        });
    </script>
</body>
</html>
