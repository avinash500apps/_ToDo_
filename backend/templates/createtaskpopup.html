<div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-xl font-bold text-center mb-4">Create New Task</h2>


    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Select Date</label>
        <input type="date"
            class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
    </div>


    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Start Time</label>
            <input type="time"
                class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">End Time</label>
            <input type="time"
                class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
        </div>
    </div>


    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Category</label>
        <select class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <option>Diet</option>
            <option>Work</option>
            <option>Personal</option>
            <option>Completed</option>
            <option>List of Books</option>
            <option>Road Trip List</option>
        </select>
    </div>


    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Task Name</label>
        <input type="text" placeholder="Enter task name"
            class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
    </div>

    <div class="flex justify-between">
        <button class="w-32 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Reset</button>
        <button class="w-32 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Save</button>
    </div>
    
</div>
