<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-6 rounded-lg shadow-lg w-96 text-center relative">
        <button id="backBtn" class="absolute top-4 left-4 text-gray-600 hover:text-gray-800">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>

        <img id="profileImage" class="mx-auto rounded-full w-24 h-24 border-4 border-gray-300" src=""
            alt="Profile Image">

        <h2 class="mt-4 text-xl font-semibold text-gray-800" id="profileName"></h2>
        <p class="text-gray-500 text-sm" id="email"></p>

        <input type="file" id="imageInput" class="hidden">

        <div class="mt-4 flex justify-between">
            <button id="uploadBtn"
                class="bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 w-1/2 mx-1">Upload</button>
            <button id="deleteBtn"
                class="bg-red-500 text-white py-2 px-4 rounded-lg hover:bg-red-600 w-1/2 mx-1">Delete</button>
        </div>
    </div>
</body>

<script>
    const firstname = localStorage.getItem("firstname") || "User"
    const email = localStorage.getItem("email") || "No email provided"
    document.getElementById("profileName").textContent = `Hi ${firstname}!`
    document.getElementById("email").textContent = email;

    document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "/sidebar";
    });

    document.getElementById("uploadBtn").addEventListener("click", () => {
        document.getElementById("imageInput").click();
    });

    document.getElementById("imageInput").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById("profileImage").src = e.target.result
            localStorage.setItem("profileImage", e.target.result)
        }
        reader.readAsDataURL(file)

        const formData = new FormData()
        formData.append("file", file)

        const savedFilename = localStorage.getItem("uploadedFilename");
        const apiUrl = savedFilename ? `http://127.0.0.1:8000/update/${savedFilename}` : "http://127.0.0.1:8000/upload/"
        const method = savedFilename ? "PUT" : "POST";

        try {
            const response = await fetch(apiUrl, {
                method: method,
                body: formData
            });

            if (response.ok) {
                const data = await response.json()
                alert(`Image ${savedFilename ? "updated" : "uploaded"} successfully!`)
                localStorage.setItem("uploadedFilename", data.filename)
                fetchImage(data.filename);
            } else {
                alert(`Failed to ${savedFilename ? "update" : "upload"} image.`)
            }
        } catch (error) {
            console.error("Error:", error);
            alert(`Error ${savedFilename ? "updating" : "uploading"} image.`)
        }
    });

    async function fetchImage(filename) {
        try {
            const response = await fetch(`/get-image/${filename}`)
            const data = await response.json()
            if (data.image_url) {
                document.getElementById("profileImage").src = data.image_url
                localStorage.setItem("profileImage", data.image_url)
            }
        } catch (error) {
            console.error("Fetch error:", error)
        }
    }

    async function deleteImage() {
        const savedFilename = localStorage.getItem("uploadedFilename")
        if (!savedFilename) {
            alert("No image to delete.")
            return;
        }

        try {
            const response = await fetch(`http://127.0.0.1:8000/delete/${savedFilename}`, { method: "DELETE" })
            if (response.ok) {
                localStorage.removeItem("uploadedFilename")
                localStorage.removeItem("profileImage")
                document.getElementById("profileImage").src = ""
                alert("Image deleted successfully!")
            } else {
                alert("Error deleting image.")
            }
        } catch (error) {
            console.error("Delete request failed:", error)
            alert("Failed to delete image.")
        }
    }

    document.getElementById("deleteBtn")?.addEventListener("click", deleteImage)

    document.addEventListener("DOMContentLoaded", () => {
        const savedImage = localStorage.getItem("profileImage")
        if (savedImage) {
            document.getElementById("profileImage").src = savedImage
        } else {
            const savedFilename = localStorage.getItem("uploadedFilename")
            if (savedFilename) {
                fetchImage(savedFilename)
            }
        }
    })

</script>

</html>
